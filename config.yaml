# ──────────────────────────────────────────────────────────────
# Tooth Detection Pipeline – master configuration
# ──────────────────────────────────────────────────────────────

# ── Paths ────────────────────────────────────────────────────
dataset:
  niihhaa_root: "../Niihhaa-Dataset-4ac91db/dataset"
  folders:
    - name: "folder 1"
      annotations_dir: "annotations"
      images_dir: "OPGs"
    - name: "folder 2"
      annotations_dir: "annnotations"   # typo in original dataset (3 n's)
      images_dir: "OPGs"
    - name: "folder 3"
      annotations_dir: "annotations"
      images_dir: "OPGs"

  yolo_output: "data/yolo_dataset"
  val_ratio: 0.15
  random_seed: 42

# ── Class mapping ────────────────────────────────────────────
classes:
  - molar
  - premolar
  - canine
  - lateral_incisor
  - central_incisor

# ── Training ─────────────────────────────────────────────────
training:
  model: "yolov8m-seg.pt"
  epochs: 150
  imgsz: 1024
  batch: 4
  patience: 30
  device: 0             # use NVIDIA GPU (cuda:0)
  project: "runs/segment"
  name: "tooth_seg"
  exist_ok: true

# ── Inference ────────────────────────────────────────────────
inference:
  weights: "runs/segment/tooth_seg/weights/best.pt"
  input_dir: "data/input_opgs"
  output_dir: "data/output"
  confidence: 0.25
  iou_threshold: 0.45
  imgsz: 1024
  bbox_expand_ratio: 0.40   # 40 % expansion for tooth + bone crop

# ── Bone landmark dataset (DenPAR) ─────────────────────────
bone_dataset:
  root: "../bone-dataset"       # path to the DenPAR bone-dataset folder

# ── Bone landmark model ─────────────────────────────────────
bone_model:
  # Architecture
  architecture:
    in_channels: 1              # grayscale input
    out_channels: 4             # CEJ, apex, bone_line, tooth
    base_channels: 32
    depth: 4

  # Training
  epochs: 80
  batch: 4
  lr: 0.001
  image_size: 512
  patience: 20
  device: 0

  # Loss: emphasize bone crest line (most important for PBL)
  channel_weights: [1.0, 1.0, 2.0, 0.5]   # CEJ, apex, bone_line, tooth

  # Output
  project: "runs/bone_landmark"
